<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Air OS</title>
<link rel="preconnect" href="https://www.youtube.com"><link rel="preconnect" href="https://i.ytimg.com"><link rel="preconnect" href="https://www.netflix.com">
<script src="vendor/hls.min.js"></script>
<script src="lib/qrcode.min.js"></script>
<script>window.Hls||document.write('<script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.13/hls.min.js"><\/script>')</script>
<style>
@font-face{font-family:Hello;src:url(fonts/hello.ttf) format('truetype');font-display:block}
/* 1rem = 16px on a 1080p screen; everything scales with the TV's resolution */
:root{--accent:#4f8cff;--dim:#ffffff8c;--glass:#ffffff14;--glass2:#ffffff24;font-size:min(.8333vw,1.4815vh)}
*{box-sizing:border-box;margin:0}
html,body{height:100%;overflow:hidden;background:#000;color:#fff;font-family:system-ui,'Noto Sans','Segoe UI',sans-serif;cursor:none;-webkit-font-smoothing:antialiased}
#bg{position:fixed;inset:0;transition:background 1s}
svg.mark{display:block}

/* ---------- boot ---------- */
#boot{position:fixed;inset:0;background:#000;display:flex;align-items:center;justify-content:center;z-index:99;transition:opacity .35s}
#boot .mark{width:7rem;height:7rem;animation:pop .6s ease-out}
@keyframes pop{from{transform:scale(.6);opacity:0}}

/* ---------- home ---------- */
#hero{position:fixed;left:0;right:0;top:0;height:64vh;transition:opacity .5s,transform .5s}
#hero .img{position:absolute;inset:0;background:center 30%/cover;opacity:0;transition:opacity .9s;
 -webkit-mask-image:linear-gradient(#000 55%,transparent);mask-image:linear-gradient(#000 55%,transparent)}
#hero .img.on{opacity:.9}
#hero .info{position:absolute;left:5rem;bottom:13vh;max-width:44rem;text-shadow:0 .1rem 1rem #000c;transition:opacity .4s}
#hero .info .kind{font-size:1.1rem;font-weight:600;color:var(--dim);text-transform:uppercase;letter-spacing:.15rem;margin-bottom:.5rem}
#hero .info h1{font-size:3.6rem;font-weight:700;letter-spacing:-.05rem;line-height:1.05}
#hero .info p{font-size:1.4rem;color:#ffffffcc;margin-top:.7rem;line-height:1.4}
body.scrolled #hero{opacity:.25;transform:translateY(-8vh)}
body.scrolled #hero .info{opacity:0}
body.setup #hero,body.setup main,body.setup header{visibility:hidden}  /* a new TV shows home only after setup */
header{position:fixed;top:0;right:0;display:flex;align-items:center;gap:1.4rem;padding:2.4rem 4.5rem;z-index:5;font-size:1.6rem;font-weight:500;text-shadow:0 0 1rem #0008}
#batt{display:none;align-items:center;gap:.5rem;font-size:1.3rem;color:#ffffffd0}
#batt i{display:inline-block;width:2.2rem;height:1.1rem;border:.13rem solid #ffffffd0;border-radius:.3rem;position:relative;padding:.12rem}
#batt i::after{content:'';position:absolute;right:-.4rem;top:.3rem;width:.2rem;height:.4rem;background:#ffffffd0;border-radius:0 .1rem .1rem 0}
#batt b{display:block;height:100%;background:#fff;border-radius:.12rem}
#batt.low b{background:#ff453a}#batt.chg b{background:#30d158}
main{position:fixed;top:50vh;left:0;right:0;padding:0 5rem;transition:transform .45s cubic-bezier(.2,.8,.2,1)}
h2{font-size:1.5rem;color:var(--dim);font-weight:600;margin:1.2rem 0 0}
.row{display:flex;gap:2.4rem;overflow:hidden;padding:1.6rem 2rem 2.8rem;margin:0 -2rem;scroll-behavior:smooth}
.row.apps{padding-bottom:1.2rem}
.tile{flex:0 0 auto;width:21rem;height:12rem;border-radius:1.1rem;display:flex;align-items:flex-end;padding:1rem 1.2rem;font-size:1.3rem;font-weight:600;position:relative;
 transition:transform .22s cubic-bezier(.2,.8,.2,1),box-shadow .22s;box-shadow:0 .6rem 1.4rem #0006}
.tile .bgi{position:absolute;inset:0;border-radius:inherit;overflow:hidden}
.tile .bgi::after{content:'';position:absolute;inset:0;background:linear-gradient(115deg,#ffffff30,transparent 40%);opacity:0;transition:opacity .2s}
.tile .lbl{position:relative;text-shadow:0 .1rem .5rem #000;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tile .ic{position:absolute;top:.9rem;right:1.1rem;font-size:2.4rem}
.tile .prog{position:absolute;left:1.2rem;right:1.2rem;bottom:.9rem;height:.35rem;background:#ffffff40;border-radius:.2rem;overflow:hidden}
.tile .prog i{display:block;height:100%;background:#fff}
.tile.focus{transform:scale(1.14);box-shadow:0 0 0 .2rem #ffffff40,0 2.4rem 3.8rem #000c;z-index:2}
.tile.focus .bgi::after{opacity:1}
.tile.app{width:17rem;height:10.2rem;align-items:center;justify-content:center;padding:0}
.tile.app img{width:5rem;height:5rem;object-fit:contain;position:relative;border-radius:1rem}
.tile.app svg{width:4.4rem;height:4.4rem;fill:none;stroke:#fff;stroke-width:4;stroke-linecap:round;stroke-linejoin:round;position:relative}
.tile.app .lbl{position:absolute;top:calc(100% + .9rem);left:0;right:0;text-align:center;font-size:1.25rem;opacity:0;transition:opacity .2s;-webkit-line-clamp:1}
.tile.app.focus .lbl{opacity:1}
.tile.poster{width:11.5rem;height:17.25rem}
.tile.has-img .lbl{opacity:0;transition:opacity .2s}.tile.has-img.focus .lbl{opacity:1}
.tile.card{flex-direction:column;align-items:center;justify-content:center;text-align:center}
.tile.card .lbl{font-size:1.6rem;font-weight:800;text-transform:uppercase;letter-spacing:.06rem}
.tile.card .ic{position:relative;top:auto;right:auto;margin-bottom:.4rem}

/* ---------- full-screen pages (settings, lists, setup) ---------- */
.screen{position:fixed;inset:0;z-index:50;padding:5rem 6rem;background:radial-gradient(70rem 45rem at 25% 15%,#1d2333,transparent 70%),#0b0c10;animation:fadein .25s}
@keyframes fadein{from{opacity:0}}
.screen h1{font-size:3rem;font-weight:700;letter-spacing:-.04rem}
.screen .hint{color:var(--dim);font-size:1.4rem;margin-top:.5rem;max-width:60rem;line-height:1.4}
.screen.centered{text-align:center}.screen.centered .hint{margin:.6rem auto 0}
.scroll{position:absolute;top:12rem;bottom:0;left:0;right:0;padding:1.5rem 6rem 5rem;overflow:hidden}
.screen.with-icon .scroll{left:42%;padding-left:0}
.screen .side{position:absolute;left:0;width:42%;top:0;bottom:0;display:flex;align-items:center;justify-content:center}
.screen .side svg{width:15rem;height:15rem;fill:none;stroke:#fff;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;opacity:.9}
.screen.centered .scroll .list{max-width:52rem;margin:0 auto}
.grid{display:flex;flex-wrap:wrap;gap:2.4rem}
.empty{color:var(--dim);font-size:1.5rem;padding:1rem 0}
.list .item{padding:1.25rem 1.8rem;background:var(--glass);border-radius:1rem;margin-bottom:.9rem;font-size:1.55rem;font-weight:500;display:flex;justify-content:space-between;gap:2rem;
 transition:transform .15s,background .15s,color .15s,box-shadow .15s}
.list .item .v{color:var(--dim);white-space:nowrap}
.list .item.focus{background:#fff;color:#000;transform:scale(1.035);box-shadow:0 1rem 2.4rem #0008}
.list .item.focus .v{color:#0009}
.kbval{font-size:2.2rem;background:var(--glass);padding:1.2rem 1.6rem;border-radius:1rem;margin:0 auto 2rem;max-width:60rem;min-height:4.8rem;word-break:break-all}
.kbrow{display:flex;gap:.7rem;margin-bottom:.7rem;justify-content:center}
.key{width:4.8rem;height:4.2rem;border-radius:.8rem;background:var(--glass);display:flex;align-items:center;justify-content:center;font-size:1.7rem;transition:transform .12s,background .12s}
.key.wide{width:12rem;font-size:1.3rem}
.key.focus{background:#fff;color:#000;transform:scale(1.12)}

/* ---------- first-run welcome ("hello") ---------- */
.hello{background:#050a14;overflow:hidden;padding:0}
.blobs{position:absolute;inset:-20%;filter:blur(6rem)}
.blobs i{position:absolute;border-radius:50%;opacity:.75;animation:drift 18s ease-in-out infinite alternate}
.blobs i:nth-child(1){width:60%;height:60%;left:5%;top:5%;background:#2b5f9e}
.blobs i:nth-child(2){width:55%;height:50%;left:35%;top:45%;background:#1f6b4f;animation-duration:22s}
.blobs i:nth-child(3){width:40%;height:45%;left:60%;top:0;background:#3a4f8f;animation-duration:26s}
@keyframes drift{to{transform:translate(8%,-6%) scale(1.15)}}
.hello .word{position:absolute;left:7rem;top:28vh;font-family:Hello,'Brush Script MT',cursive;font-size:15rem;line-height:1.3;white-space:nowrap;
 -webkit-text-stroke:.05em #fff;text-shadow:0 .4rem 3rem #0004;clip-path:inset(-20% 100% -20% 0)}
.hello .word.write{animation:write 1.7s cubic-bezier(.4,0,.2,1) forwards}
.hello .word.out{clip-path:inset(-20% 0 -20% 0);animation:fadeout .6s forwards}
@keyframes write{to{clip-path:inset(-20% 0 -20% 0)}}
@keyframes fadeout{to{opacity:0;transform:translateY(-.6rem)}}
.hello .sub{position:absolute;left:9rem;top:calc(28vh + 21rem);font-size:1.7rem;font-weight:500;color:#ffffffe0;transition:opacity .6s}
.remote{position:absolute;right:9rem;top:12vh;height:76vh;filter:drop-shadow(0 3rem 4rem #000b);animation:float 6s ease-in-out infinite}
.remote svg{height:100%;width:auto;transform:perspective(60rem) rotateY(-14deg) rotateZ(4deg)}
@keyframes float{50%{transform:translateY(-1.2rem)}}
.okpulse{animation:okp 2s ease-in-out infinite}
@keyframes okp{50%{stroke-width:7;filter:drop-shadow(0 0 6px #4fe3ff)}}
.remote-guide .remote{left:9rem;right:auto;top:16vh;height:72vh}
.legend{position:absolute;left:46%;top:36vh;right:6rem}
.legend div{display:flex;align-items:center;gap:1.6rem;font-size:1.6rem;margin-bottom:1.7rem;color:#ffffffe0}
.legend b{display:inline-flex;align-items:center;justify-content:center;min-width:5.4rem;height:3.2rem;padding:0 1rem;border-radius:1.6rem;background:var(--glass2);font-size:1.25rem;font-weight:700;color:#7fe8ff}

/* ---------- sign in with a phone ---------- */
.qrbox{position:absolute;left:9rem;top:50%;transform:translateY(-50%);width:26rem;height:26rem;background:#fff;border-radius:1.6rem;padding:1.4rem;box-shadow:0 2rem 4rem #000a}
.qrbox svg{width:100%;height:100%;display:block}
.qrtext{position:absolute;left:43rem;right:6rem;top:50%;transform:translateY(-50%)}
.qrtext h1{margin-bottom:1.6rem}
.qrtext ol{padding-left:2rem;font-size:1.6rem;line-height:1.5;color:#ffffffe0}.qrtext ol li{margin-bottom:.8rem;padding-left:.4rem}
.qrtext .hint{margin:1.6rem 0 2.4rem}
.qrtext .list{max-width:34rem}
.qrwait{display:inline-flex;align-items:center;gap:.8rem;font-size:1.3rem;color:var(--dim)}
.qrwait i{width:.8rem;height:.8rem;border-radius:50%;background:#4f8cff;animation:okp 1.4s infinite}

/* ---------- screensaver ---------- */
#saver{position:fixed;inset:0;z-index:95;background:#000;display:none;overflow:hidden}
#saver.on{display:block;animation:fadein 1.5s}
#saver .img{position:absolute;inset:-4%;background:center/cover;opacity:0;transition:opacity 2.5s}
#saver .img.on{opacity:1;animation:kenburns 20s linear forwards}
@keyframes kenburns{from{transform:scale(1)}to{transform:scale(1.12) translate(-2%,-1%)}}
#saver .t{position:absolute;right:4.5rem;bottom:3.5rem;font-size:4rem;font-weight:300;text-shadow:0 .2rem 2rem #000}
#saver .n{position:absolute;left:4.5rem;bottom:3.8rem;font-size:1.4rem;color:#ffffffc0;text-shadow:0 .2rem 1rem #000}

/* ---------- motion alert ---------- */
#motion{position:fixed;top:2.4rem;right:3rem;width:27rem;z-index:96;background:#1c1d22f2;border-radius:1.4rem;overflow:hidden;
 box-shadow:0 1.6rem 4rem #000b;transform:translateX(34rem);transition:transform .45s cubic-bezier(.2,.8,.2,1)}
#motion.on{transform:none}
#motion img{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;background:#000}
#motion div{padding:1rem 1.3rem;font-size:1.2rem;color:#ffffffb0}#motion b{display:block;font-size:1.45rem;color:#fff}

/* ---------- player ---------- */
#player{position:fixed;inset:0;background:#000;z-index:80;display:none}
#player.open{display:block}
#player video{width:100%;height:100%;object-fit:contain;background:#000}
#player.audio video{opacity:0}
#player.audio{background:radial-gradient(60rem 40rem at 50% 40%,#2a2f6a,#000)}
#pstate{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:1.9rem;background:#000a;padding:1rem 2rem;border-radius:1rem;display:none;max-width:80%;text-align:center}
#player.audio #pstate{background:none;font-size:3rem}
#osd{position:absolute;left:0;right:0;bottom:0;padding:6rem 5rem 3rem;background:linear-gradient(transparent,#000d);transition:opacity .4s}
#osd.hide{opacity:0}
#osd .t{font-size:2rem;font-weight:700;margin-bottom:1.2rem}
#osd .bar{height:.4rem;background:#ffffff40;border-radius:.2rem;overflow:hidden}
#osd .bar i{display:block;height:100%;width:0;background:#fff}
#osd .meta{display:flex;justify-content:space-between;margin-top:.8rem;color:#fffc;font-size:1.2rem}
.badge{background:#e53935;color:#fff;padding:.1rem .7rem;border-radius:.4rem;font-size:1rem;margin-left:.8rem;vertical-align:middle}

/* ---------- app launch + notifications ---------- */
#launch{position:fixed;inset:0;z-index:90;background:#000;display:none;align-items:center;justify-content:center}
#launch.on{display:flex;animation:fadein .15s}
#launch .tile{transform:scale(1.4);animation:zoomin .35s cubic-bezier(.2,.8,.2,1)}
@keyframes zoomin{from{transform:scale(1)}}
#launch .tile .lbl{display:none}
#toast{position:fixed;top:2.2rem;left:50%;transform:translate(-50%,-150%);background:#1c1d22ee;padding:1rem 2rem;border-radius:1.6rem;transition:transform .35s cubic-bezier(.2,.8,.2,1);z-index:100;font-size:1.3rem;font-weight:500;box-shadow:0 1rem 3rem #0008}
#toast.show{transform:translate(-50%,0)}
</style>
</head>
<body>
<div id="bg"></div>
<div id="hero"><div class="img"></div><div class="img"></div><div class="info"><div class="kind"></div><h1></h1><p></p></div></div>
<div id="boot"></div>
<header><span id="batt"><i><b></b></i><span></span></span><span id="clock"></span></header>
<main id="home"></main>
<div id="player"><video id="video" autoplay playsinline></video><div id="pstate"></div>
 <div id="osd"><div class="t"></div><div class="bar"><i></i></div><div class="meta"><span id="ptime"></span><span id="phelp"></span></div></div></div>
<div id="launch"></div>
<div id="saver"><div class="img"></div><div class="img"></div><div class="n"></div><div class="t"></div></div>
<div id="toast"></div>
<div id="motion"><img alt=""><div><b></b>Motion detected</div></div>

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const cssUrl=u=>`url("${String(u).replace(/["\\\n\r]/g,'')}")`;
const short=u=>u.length>40?u.slice(0,37)+'…':u;
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('show'),2600)}
const tick=()=>$('#clock').textContent=new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit',hour12:!!window.h12});
tick();setInterval(tick,1000);
const logoSvg=(size,id)=>`<svg class="mark" viewBox="0 0 64 64" width="${size}" height="${size}"><defs><linearGradient id="${id}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4fd1ff"/><stop offset=".5" stop-color="#4f8cff"/><stop offset="1" stop-color="#b44fff"/></linearGradient></defs><circle cx="32" cy="32" r="29" fill="none" stroke="url(#${id})" stroke-width="4"/><path d="M18 46 L32 16 L46 46" fill="none" stroke="url(#${id})" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M22 36 Q32 30 42 36" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round"/></svg>`;
$('#boot').innerHTML=logoSvg(112,'lgb');

// ---- System service (airos/server.py). null when the UI is opened without it. ----
let sys=null,acct=null;
async function api(path,body){
 const r=await fetch('/api/'+path,body===undefined?{}:{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
 const j=await r.json().catch(()=>{throw Error('System service not available')});
 if(!r.ok)throw Error(j.error||r.statusText);
 return j;
}

// ---- Settings storage: on the device via the service, else in the browser ----
const defaults={theme:0,name:'Living Room TV',playlist:'',country:'',history:{},setupDone:false,screensaver:10,
 fit:100,start:'home',clock24:true,pin:'',locks:{},autoOff:0};
let cfg={...defaults};
async function loadCfg(){
 if(sys){try{cfg={...defaults,...await api('config')};return}catch{}}
 try{cfg={...defaults,...JSON.parse(localStorage.getItem('airos')||'{}')}}catch{}
}
function save(){clearTimeout(save.t);save.t=setTimeout(()=>{
 if(sys)api('config',cfg).catch(()=>{});else try{localStorage.setItem('airos',JSON.stringify(cfg))}catch{}},400)}

const themes=[['#16264a','#24163f'],['#0c3a2e','#13304a'],['#46261a','#40121e'],['#1a1a1a','#2b2b2b']],themeNames=['Aurora','Forest','Sunset','Mono'];
function applyTheme(){const [a,b]=themes[cfg.theme]||themes[0];
 window.h12=!cfg.clock24;tick();
 document.body.style.transform=cfg.fit<100?`scale(${cfg.fit/100})`:'';  // Screen fit, for TVs that crop the edges
 $('#bg').style.background=`radial-gradient(90rem 55rem at 15% 100%,${a},transparent 70%),radial-gradient(70rem 50rem at 95% 90%,${b},transparent 70%),#000`}

// ---- Battery (laptops) ----
function showBattery(b){const e=$('#batt');if(!b){e.style.display='none';return}
 e.style.display='flex';e.querySelector('b').style.width=b.level+'%';e.querySelector('span').textContent=b.level+'%';
 e.classList.toggle('low',b.level<=15&&!b.charging);e.classList.toggle('chg',!!b.charging)}
async function pollBattery(){try{showBattery((await api('info')).battery)}catch{}}

// ---- Content ----
// Openly licensed films (Blender Foundation and others), streamed from public test CDNs.
// poster = portrait key art, backdrop = landscape still (Wikimedia Commons, free licenses)
const WM=(path,file,w=500)=>`https://upload.wikimedia.org/wikipedia/commons/thumb/${path}/${file}/${w}px-${file}`;
const featured=[
 {title:'Big Buck Bunny',url:'https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8',poster:WM('c/c5','Big_buck_bunny_poster_big.jpg'),backdrop:WM('9/91','Peach_poster_rodents.jpg',1280),desc:'A gentle giant rabbit takes on three bullying rodents. Blender Foundation, 2008.'},
 {title:'Sintel',url:'https://bitdash-a.akamaihd.net/content/sintel/hls/playlist.m3u8',poster:WM('8/8f','Sintel_poster.jpg'),desc:'A young woman searches for the baby dragon she raised. Blender Foundation, 2010.'},
 {title:'Tears of Steel',url:'https://demo.unified-streaming.com/k8s/features/stable/video/tears-of-steel/tears-of-steel.ism/.m3u8',poster:WM('7/70','Tos-poster.png'),backdrop:WM('1/12','Tears_of_Steel_frame_09_1a.jpg',1280),desc:'Scientists in Amsterdam try to save the world from robots. Blender Foundation, 2012.'},
 {title:'Elephants Dream',url:'https://archive.org/download/ElephantsDream/ed_1024_512kb.mp4',poster:WM('0/0c','ElephantsDreamPoster.jpg'),backdrop:WM('e/e8','Elephants_Dream_s5_both.jpg',1280),desc:'Two men explore a strange, endless machine. The first open movie, 2006.'},
 {title:'Art of Motion',url:'https://bitdash-a.akamaihd.net/content/MI201109210084_1/m3u8s/f08e80da-bf1d-4e3d-8899-f0f6155f6efa.m3u8',icon:'🎥',desc:'Sport and nature footage in high definition.'},
 {title:'Sintel Trailer',url:'https://download.blender.org/durian/trailer/sintel_trailer-720p.mp4',poster:WM('f/f3','Sintel_Poster_Paintover_clean.jpg'),desc:'The trailer for Sintel.'}];
// Free live channels broadcasters publish for web viewing.
const demoChannels=[
 {title:'DW News',i:'🌍',url:'https://dwamdstream102.akamaized.net/hls/live/2015525/dwstream102/index.m3u8'},
 {title:'CBS News 24/7',i:'📰',url:'https://cbsn-us.cbsnstream.cbsnews.com/out/v1/55a8648e8f134e82a470f83d562deeca/master.m3u8'},
 {title:'Red Bull TV',i:'🏂',url:'https://rbmn-live.akamaized.net/hls/live/590964/BoRB-AT/master.m3u8'}];
const FREE_PLAYLIST='https://iptv-org.github.io/iptv/languages/eng.m3u';
// Free channels by country (iptv-org). The best-known channels in each country are listed first.
const COUNTRIES=[['gb','United Kingdom'],['us','United States'],['ie','Ireland'],['ca','Canada'],['au','Australia'],['nz','New Zealand'],
 ['in','India'],['za','South Africa'],['ng','Nigeria'],['de','Germany'],['fr','France'],['es','Spain'],['it','Italy'],['nl','Netherlands'],
 ['be','Belgium'],['pt','Portugal'],['pl','Poland'],['se','Sweden'],['no','Norway'],['dk','Denmark'],['fi','Finland'],['gr','Greece'],
 ['tr','Turkey'],['br','Brazil'],['mx','Mexico'],['ar','Argentina'],['jp','Japan'],['kr','South Korea'],['ph','Philippines'],['pk','Pakistan'],
 ['ae','United Arab Emirates'],['sa','Saudi Arabia'],['eg','Egypt']];
const POPULAR={
 gb:['BBC One','BBC Two','ITV1','ITV 1','Channel 4','Channel 5','BBC News','Sky News','GB News','BBC Three','BBC Four','ITV2','ITV3','ITV4','E4','More4','Film4','Dave','Quest','CBBC','CBeebies','Al Jazeera English'],
 us:['ABC','CBS','NBC','FOX','PBS','CNN','Fox News','MSNBC','CBS News','NBC News','ABC News','Bloomberg','NewsNation','Weather','CNBC','Court TV'],
 ie:['RTÉ One','RTE One','RTÉ2','RTE 2','Virgin Media One','TG4','RTÉ News','RTE News','Virgin Media Two','Oireachtas'],
 ca:['CBC','CTV','Global','Citytv','CBC News','CTV News','CPAC','TVO','Télé-Québec','TVA','Radio-Canada'],

function sortPopular(list,c){

 const items=list.map((ch,i)=>{const t=ch.title.toLowerCase().replace(/\s*\(.*?\)|\s*\[.*?\]/g,'').trim();
  return {ch,i,t,p:pop.findIndex(n=>t===n||t.startsWith(n+' ')||t.startsWith(n+'.')),part:/not 24\/7/i.test(ch.title)}});
 const best={};
 for(const x of items)if(x.p>=0&&!x.part){const b=best[x.p];if(!b||x.t.length<b.t.length)best[x.p]=x}
 for(const x of items)x.r=(x.part?3*N+2:0)+(x.p<0?2*N+1:best[x.p]===x?x.p:N+x.p);

// On-screen keyboard; resolves to the text, or null if cancelled.
function ask(title,initial='',secret=false){return new Promise(res=>{

 const draw=()=>vEl.textContent=(secret?'•'.repeat(val.length):val)+'▏';
 const finish=()=>{done=true;back();res(val)};
 const relabel=()=>out.flat().forEach(c=>{if(c.el.textContent.length===1)c.el.textContent=shift?c.el.textContent.toUpperCase():c.el.textContent.toLowerCase()});
 const row=(keys)=>{const r=document.createElement('div');r.className='kbrow';kb.appendChild(r);
  out.push(keys.map(([label,fn,wide])=>{const b=document.createElement('div');b.className='key'+(wide?' wide':'');b.textContent=label;b.onclick=fn;r.appendChild(b);return{el:b,go:fn}}))};
 ['1234567890','qwertyuiop','asdfghjkl-','zxcvbnm_.@','!#$%&*+=?/'].forEach(s=>row([...s].map(ch=>[ch,()=>{val+=shift?ch.toUpperCase():ch;draw()}])));
 row([['⇧ Shift',()=>{shift=!shift;relabel()},1],['Space',()=>{val+=' ';draw()},1],['⌫ Delete',()=>{val=val.slice(0,-1);draw()},1],['Done ✓',finish,1]]);
 draw();
 push({el,rows:out,close:()=>{if(!done)res(null)},onRaw:e=>{
  if(e.ctrlKey||e.altKey||e.metaKey)return false;
  if(e.key.length===1){val+=e.key;typed=true;draw();return true}

  if(e.key==='Enter'&&typed){finish();return true}
 }});
})}

const KEYS={ArrowUp:'Up',ArrowDown:'Down',ArrowLeft:'Left',ArrowRight:'Right',Enter:'OK',' ':'OK',Select:'OK',Accept:'OK',Escape:'Back',Backspace:'Back',BrowserBack:'Back',GoBack:'Back',
 h:'Home',H:'Home',BrowserHome:'Home',MediaPlayPause:'Play',MediaPlay:'Play',MediaPause:'Play',MediaFastForward:'Right',MediaRewind:'Left',
 MediaTrackNext:'Right',MediaTrackPrevious:'Left',AudioVolumeUp:'VolUp',AudioVolumeDown:'VolDown',ChannelUp:'Up',ChannelDown:'Down',PageUp:'Up',PageDown:'Down'};
let booting=true;
function onKey(e){
 if(booting)return;
 idleAt=Date.now();if(saverOn()){e.preventDefault();stopSaver();return}
 if(ctx?.onRaw?.(e)){e.preventDefault();return}
 const k=KEYS[e.key];if(!k)return;
 e.preventDefault();
 if(ctx?.onKey?.(k))return;
 switch(k){
  case 'Up':pos.r--;break;case 'Down':pos.r++;break;case 'Left':pos.c--;break;case 'Right':pos.c++;break;
  case 'OK':run(active()[pos.r]?.[pos.c]?.go);return;
  case 'Back':if(!ctx?.noBack)back();return;
  case 'Home':if(!ctx?.noBack)while(stack.length)back();return;
  case 'VolUp':volume(5);return;case 'VolDown':volume(-5);return;
  default:return}
 focus();
}

// Air-mouse remotes (like the G20S in pointer mode) turn OK into a mouse click. The pointer is hidden, so a click
// always means "OK on what's highlighted", and a right click means Back.
const press=key=>onKey({key,preventDefault(){},ctrlKey:false,altKey:false,metaKey:false});
for(const t of ['mousedown','click','dblclick','auxclick','contextmenu'])document.addEventListener(t,e=>{e.preventDefault();e.stopPropagation()},true);
document.addEventListener('mouseup',e=>{e.preventDefault();e.stopPropagation();if(e.button===0)press('Enter');else if(e.button===2)press('Escape')},true);

 cur=item;stopMedia();

 $('#phelp').textContent=item.channel?'↑↓ change channel · OK pause · Back exit':'OK pause · ←→ seek 10s · ↑↓ volume · Back exit';
 $('#player').classList.toggle('audio',!!item.audio);
 pstate(item.audio?'♪ '+item.title:'Loading…');
 if(item.poster)video.poster=item.poster;
 if(/\.m3u8($|\?)/i.test(item.url)&&window.Hls?.isSupported()){
  hls=new Hls();
  hls.on(Hls.Events.ERROR,(_,d)=>{if(!d.fatal)return;
   if(d.type===Hls.ErrorTypes.MEDIA_ERROR){hls.recoverMediaError();return}
   hls.destroy();hls=null;
   pstate(d.type===Hls.ErrorTypes.NETWORK_ERROR?'This stream is offline or unavailable':"Can't play this stream")});
  hls.loadSource(item.url);hls.attachMedia(video);
 }else video.src=item.url;
 const h=cfg.history[item.url];
 if(h&&h.pos>10)video.addEventListener('loadedmetadata',()=>{video.currentTime=h.pos;toast('Resuming at '+fmt(h.pos))},{once:true});
 meta();osd();
}
function play(item,list){
 let idx=list?list.indexOf(item):-1;
 $('#player').classList.add('open');load(item);
 push({rows:[],
  close:()=>{saveProgress(true);stopMedia();cur=null;$('#player').classList.remove('open')},
  next:()=>{if(list&&!item.channel&&idx<list.length-1){load(list[++idx]);return true}},
  onKey:k=>{osd();
   if(k==='OK'||k==='Play'){video.paused?video.play().catch(()=>{}):video.pause();return true}
   if((k==='Up'||k==='Down')&&item.channel){idx=(idx+(k==='Up'?1:-1)+list.length)%list.length;load(list[idx]);return true}
   if(k==='Up'||k==='Down'){volume(k==='Up'?5:-5);return true}
   if(k==='Left'||k==='Right'){if(isFinite(video.duration))video.currentTime=Math.max(0,Math.min(video.duration-1,video.currentTime+(k==='Right'?10:-10)));return true}
  }});
}
function saveProgress(force){
 if(!cur||cur.audio||cur.channel||!isFinite(video.duration)||video.duration<60)return;
 const now=Date.now();if(!force&&now-lastSave<5000)return;lastSave=now;
 if(video.ended||video.currentTime>video.duration-20)delete cfg.history[cur.url];
 else if(video.currentTime>10)cfg.history[cur.url]={title:cur.title,poster:cur.poster||'',backdrop:cur.backdrop||'',pos:video.currentTime,dur:video.duration,at:now};
 else return;
 Object.keys(cfg.history).sort((a,b)=>cfg.history[b].at-cfg.history[a].at).slice(20).forEach(k=>delete cfg.history[k]);
 save();
}
video.addEventListener('waiting',()=>{if(cur&&!cur.audio)pstate('Loading…')});
video.addEventListener('playing',()=>{if(cur&&!cur.audio)pstate('');osd()});
video.addEventListener('timeupdate',()=>{meta();saveProgress()});
video.addEventListener('pause',()=>{meta();osd()});
video.addEventListener('error',()=>{if(cur&&video.getAttribute('src'))pstate("Can't play this "+(cur.channel?'channel':'file')+(video.error?.code===4?' (format not supported)':''))});
video.addEventListener('ended',()=>{saveProgress(true);if(ctx?.next&&!ctx.next())back()});

function parseM3U(txt){
 const out=[];let info=null;
 for(const raw of txt.split(/\r?\n/)){const l=raw.trim();
  if(l.startsWith('#EXTINF')){info={title:l.slice(l.lastIndexOf(',')+1).trim(),logo:(l.match(/tvg-logo="([^"]*)"/)||[])[1]}}
  else if(l&&!l.startsWith('#')){out.push({title:info?.title||l,logo:info?.logo,url:l});info=null}}
 return out;
}

// Grab a frame from each local video to use as its tile picture (one at a time, cached for the session).
const thumbs=new Map();let thumbQueue=Promise.resolve();
const showThumb=(el,data)=>{el.querySelector('.bgi').style.background=`url(${data}) center/cover`;el.classList.add('has-img')};
function thumbnail(url,el){
 if(thumbs.has(url))return showThumb(el,thumbs.get(url));
 thumbQueue=thumbQueue.then(()=>new Promise(done=>{
  if(!el.isConnected)return done();
  const v=document.createElement('video');v.muted=true;v.preload='metadata';
  const finish=()=>{clearTimeout(t);v.removeAttribute('src');v.load();done()},t=setTimeout(finish,8000);
  v.onloadedmetadata=()=>{v.currentTime=Math.min(isFinite(v.duration)?v.duration*.1:5,60)};
  v.onseeked=()=>{try{
   const c=document.createElement('canvas');c.width=384;c.height=216;const g=c.getContext('2d');
   const s=Math.max(384/v.videoWidth,216/v.videoHeight),w=v.videoWidth*s,h=v.videoHeight*s;
   g.drawImage(v,(384-w)/2,(216-h)/2,w,h);const data=c.toDataURL('image/jpeg',.75);thumbs.set(url,data);showThumb(el,data)}catch{}finish()};
  v.onerror=finish;v.src=url;
 }));
}

let upd=null;
function updateLabel(){

 const s=upd?.state,v=upd?.current||sys.version;
 return s==='checking'?'Checking…':s==='installing'?`Installing ${upd.latest}…`:s==='error'?'Check failed · OK to retry'
  :s==='uptodate'?`Up to date (${v})`:`Version ${v} · OK to check`;
}
async function checkUpdates(){
 if(!sys?.features?.updates)return toast("Automatic updates aren't set up on this build");
 upd=await api('update',{});let n=0;
 const t=setInterval(async()=>{try{upd=await api('update')}catch{}ctx?.refresh?.();
  if(!['checking','installing'].includes(upd?.state)||++n>200)clearInterval(t);
  if(upd?.state==='error')toast(upd.error||'Update failed')},3000);
}

// ---- Air OS account: online, so settings follow the viewer to every TV ----
async function accountStep(hint){
 const o=await choose('Sign in to Air OS',hint,[
  ...(acct?[{t:'Continue as '+acct.email,v:()=>'✓',a:'keep'}]:[]),
  {t:acct?'Use a different account':'Sign in or create an account',v:()=>'📱 Use your phone',a:'phone'},
  ...(acct?[]:[{t:'Not now',v:()=>'›',a:'skip'}])],{icon:ICONS.user});
 if(!o||o.a==='keep'||o.a==='skip')return o;
 return await phoneSignIn()?o:'again';
}

// Sign in with a phone: the TV shows a QR code for a one-time sign-in page it serves on the home network.
const qrSvg=text=>{const q=qrcode(0,'M');q.addData(text);q.make();return q.createSvgTag({cellSize:8,margin:0,scalable:true})};
function phoneSignIn(){return new Promise(async res=>{
 let pair;try{pair=await api('account/pair',{})}catch(e){toast(e.message);return res(false)}
 let done=false;
 const el=document.createElement('section');el.className='screen';
 el.innerHTML=`<div class="qrbox">${window.qrcode?qrSvg(pair.url):''}</div><div class="qrtext"><h1>Sign in with your phone</h1>
  <ol><li>Point your phone's camera at the code.</li><li>Tap the link, then create your Air OS account or sign in.</li><li>${esc(cfg.name)} signs in by itself.</li></ol>
  <div class="hint">No camera? Go to <b style="color:#fff">reallyconnorc.github.io/AirOS/link</b> on any phone or computer and scan again later.</div>
  <div class="qrwait"><i></i>Waiting for your phone…</div><div class="list" style="margin-top:2rem"></div></div>`;
 const item=document.createElement('div');item.className='item';item.innerHTML='<span>Back</span><span class="v">›</span>';
 el.querySelector('.list').appendChild(item);document.body.appendChild(el);
 const finish=ok=>{if(done)return;done=true;clearInterval(t);clearTimeout(expire);back();res(ok)};
 const t=setInterval(async()=>{try{const st=await api('account/pair?code='+encodeURIComponent(pair.code));
  if(st.state==='done'){acct=st.account;await loadCfg();applyTheme();toast('Signed in as '+acct.email);finish(true)}
  }catch{}},2000);
 const expire=setTimeout(()=>{if(!done){toast('That code expired. Choose Sign in again for a new one.');finish(false)}},600000);
 push({el,rows:[[{el:item,go:()=>finish(false)}]],close:()=>{clearInterval(t);clearTimeout(expire);if(!done){done=true;res(false)}}});
})}

// ---- Screensaver: slow pictures and the time after a few idle minutes ----
let idleAt=Date.now(),saverLayer=0,saverIdx=0,saverTimer=null;
const saverOn=()=>$('#saver').classList.contains('on');
function saverNext(){const url=scenery('saver-'+Date.now()+'-'+saverIdx++),imgs=document.querySelectorAll('#saver .img');
 const img=new Image();img.onload=()=>{saverLayer^=1;imgs[saverLayer].style.backgroundImage=cssUrl(url);
  imgs[saverLayer].classList.remove('on');void imgs[saverLayer].offsetWidth;imgs[saverLayer].classList.add('on');imgs[saverLayer^1].classList.remove('on')};img.src=url}
function startSaver(){$('#saver').classList.add('on');saverNext();saverTimer=setInterval(saverNext,15000)}
function stopSaver(){$('#saver').classList.remove('on');clearInterval(saverTimer)}
setInterval(()=>{$('#saver .t').textContent=$('#clock').textContent;
 const watching=$('#player').classList.contains('open')&&!video.paused;
 if(watching)idleAt=Date.now();
 if(sleepAt&&Date.now()>sleepAt){sleepAt=0;powerOff('Sleep timer')}
 if(cfg.autoOff&&Date.now()-idleAt>cfg.autoOff*3600000){idleAt=Date.now();powerOff('Not used for '+cfg.autoOff+' hours')}
 if(!saverOn()&&!booting&&cfg.screensaver&&!document.body.classList.contains('setup')&&Date.now()-idleAt>cfg.screensaver*60000)startSaver()},5000);

function powerOff(why){
 if(sys?.features?.power){toast(why+' · turning off in 1 minute. Press any button to cancel.');
  const at=idleAt;setTimeout(()=>{if(idleAt===at)api('power',{action:'poweroff'}).catch(()=>{})},60000)}
 else toast(why+' · the TV would turn off now')}

// ---- Motion alerts from Home cameras: a card with the live picture, top right ----
let motionSince=Date.now()/1000,motionT;
setInterval(async()=>{if(!sys||document.hidden)return;
 try{const {events,now}=await api('home/events?since='+motionSince);motionSince=now;const ev=events.pop();if(!ev)return;
  const m=$('#motion');m.querySelector('b').textContent=ev.name;m.querySelector('img').src='/api/home/cam/'+ev.camera+'/live';
  m.classList.add('on');clearTimeout(motionT);motionT=setTimeout(()=>{m.classList.remove('on');setTimeout(()=>{if(!m.classList.contains('on'))m.querySelector('img').removeAttribute('src')},600)},10000);
 }catch{}},2000);

// A short chime, to check where sound is coming from.
function chime(){try{const a=new AudioContext(),t=a.currentTime;[523.25,659.25,783.99].forEach((f,i)=>{
 const o=a.createOscillator(),g=a.createGain();o.frequency.value=f;o.connect(g);g.connect(a.destination);
 g.gain.setValueAtTime(0,t+i*.12);g.gain.linearRampToValueAtTime(.25,t+i*.12+.02);g.gain.exponentialRampToValueAtTime(.001,t+i*.12+.9);
 o.start(t+i*.12);o.stop(t+i*.12+1)});setTimeout(()=>a.close(),2000)}catch{}}

const HELLOS=[['hello','Press OK on your remote to continue.'],['bonjour','Appuyez sur OK sur votre télécommande pour continuer.'],
 ['hola','Pulsa OK en el mando para continuar.'],['hallo','Drücke OK auf der Fernbedienung, um fortzufahren.'],
 ['ciao','Premi OK sul telecomando per continuare.'],['olá','Prima OK no comando para continuar.'],
 ['dobar dan','Za nastavak pritisnite OK na daljinskom upravljaču.'],['hej','Tryck på OK på fjärrkontrollen för att fortsätta.'],
 ['witaj','Naciśnij OK na pilocie, aby kontynuować.'],['merhaba','Devam etmek için kumandada OK tuşuna basın.']];
function hello(){return new Promise(res=>{
 let done=false;
 const el=document.createElement('section');el.className='screen hello';
 el.innerHTML=`<div class="blobs"><i></i><i></i><i></i></div><div class="word"></div><div class="sub"></div><div class="remote">${REMOTE_SVG}</div>`;
 document.body.appendChild(el);
 const w=el.querySelector('.word'),sub=el.querySelector('.sub');let i=0,fade;
 const next=()=>{const [word,line]=HELLOS[i++%HELLOS.length];
  w.className='word';void w.offsetWidth;w.textContent=word;w.classList.add('write');
  sub.style.opacity=0;setTimeout(()=>{sub.textContent=line;sub.style.opacity=1},500);
  fade=setTimeout(()=>{w.classList.add('out');sub.style.opacity=0},3600)};
 next();const t=setInterval(next,4300);
 const stop=()=>{clearInterval(t);clearTimeout(fade)};
 const go=()=>{done=true;stop();back();res(true)};
 push({el,rows:[[{el:document.createElement('i'),go}]],noBack:true,close:()=>{stop();if(!done)res(null)}});
})}
function remoteGuide(){return new Promise(res=>{let done=false;
 const el=screen('Your remote','Air OS works with the remote that came with your TV box.');el.classList.add('remote-guide');
 for(const e of el.querySelectorAll('h1,.hint'))e.style.marginLeft='46%';el.querySelector('h1').style.marginTop='18vh';
 el.insertAdjacentHTML('beforeend',`<div class="remote">${REMOTE_SVG}</div><div class="legend">
  <div><b>OK</b>Select · pause and play</div><div><b>◀ ▶ ▲ ▼</b>Move around</div><div><b>↩ Back</b>Go back</div>
  <div><b>⌂ Home</b>Back to Air OS from anywhere, even YouTube</div><div><b>🔊 Vol</b>Change the volume</div>
  <div><b>➚ Pointer</b>Wave the remote to move a pointer (handy in Netflix)</div>
  <div style="margin-top:3rem;color:#fff"><b style="background:#fff;color:#000">OK</b>Continue</div></div>`);
 const go=()=>{done=true;back();res(true)};
 push({el,rows:[[{el:document.createElement('i'),go}]],close:()=>{if(!done)res(null)}});
})}
// Setup step: install the newest Air OS before the viewer starts. The TV restarts itself if there's an update,
// and setup carries on from the start afterwards.
function setupUpdate(){return new Promise(async res=>{
 const el=screen('Checking for updates','Making sure this TV has the newest Air OS.',{centered:true,logo:true});
 const line=document.createElement('div');line.className='qrwait';line.style.cssText='justify-content:center;width:100%;margin-top:2rem';
 line.innerHTML='<i></i><span>Looking for updates…</span>';el.querySelector('.scroll').appendChild(line);
 push({el,rows:[],noBack:true});
 const say=t=>line.querySelector('span').textContent=t;
 let t;const finish=()=>{clearInterval(t);back();res(true)};
 let st;try{st=await api('update',{})}catch{return finish()}
 let n=0;t=setInterval(async()=>{try{st=await api('update')}catch{}
  if(st?.state==='installing')say(`Installing Air OS ${st.latest}… your TV will restart by itself when it's done.`);
  else if(st?.state!=='checking'||++n>40){say(st?.state==='uptodate'?'Your TV is up to date.':'Couldn\'t check for updates. Air OS will try again tonight.');clearInterval(t);setTimeout(finish,1500)}},2000);
})}

// One question per screen. Resolves to the picked option, or null when the viewer pressed Back.
function choose(title,hint,opts,extra={}){return new Promise(res=>{let done=false;
 listScreen(title,hint,opts.map(o=>({t:o.t,v:o.v,adj:o.adj,go:()=>{done=true;back();res(o)}})),{centered:!extra.icon,...extra,close:()=>{if(!done)res(null)}})})}
async function setup(){
 document.body.classList.add('setup');
 const steps=[
  ()=>hello(),
  ()=>remoteGuide(),
  ()=>choose('Your privacy','Air OS has no ads and doesn\'t track what you watch. Your settings stay on this TV unless you sign in to an Air OS account. Apps like YouTube and Netflix have their own privacy policies.',
   [{t:'Continue',v:()=>'›'}],{icon:ICONS.lock}),
  sys?.features?.wifi&&(async()=>{
   toast('Looking for Wi‑Fi networks…');let nets=[];try{nets=(await api('wifi')).networks}catch(e){toast(e.message)}
   const o=await choose('Choose a Wi‑Fi network','Your TV needs the internet for YouTube, Netflix and updates.',[
    ...nets.map(n=>({t:(n.active?'✓ ':'')+n.ssid,v:()=>`${n.secure?'🔒 ':''}${n.signal}%`,n})),
    {t:nets.some(n=>n.active)?'Keep current connection':'Use a network cable instead',v:()=>'›'}],{icon:ICONS.wifi});
   if(!o?.n||o.n.active)return o;
   const pw=o.n.secure?await ask('Password for '+o.n.ssid,'',true):'';if(pw===null)return 'again';
   toast('Connecting…');try{await api('wifi',{ssid:o.n.ssid,password:pw});toast('Connected to '+o.n.ssid);return o}
   catch(e){toast("Couldn't connect: "+e.message);return 'again'}}),
  sys?.features?.updates&&(()=>setupUpdate()),
  sys?.features?.accounts&&(()=>accountStep('Keep your look, playlist and watch history on every Air OS TV.')),
  sys?.features?.outputs&&(async()=>{
   try{outputs=(await api('audio')).outputs}catch{outputs=[]}
   if(!outputs.length)return true;
   const o=await choose('Where should sound play?','Choose an output to hear a test sound.',[
    ...outputs.map(x=>({t:x.label,v:()=>x.active?'✓':'',x})),{t:'Play the test sound again',v:()=>'♪',test:true},{t:'Continue',v:()=>'›'}],{icon:ICONS.sound});
   if(o?.x){try{outputs=(await api('audio',{id:o.x.id})).outputs}catch(e){toast(e.message)}setTimeout(chime,300);return 'again'}
   if(o?.test){chime();return 'again'}
   return o}),
  ()=>{if(!cfg.country)cfg.country=guessCountry();return pickCountry()},
  async()=>{const names=['Living Room','Bedroom','Kitchen','Office'];
   const o=await choose('Where is this TV?','This name helps you tell your Air OS TVs apart.',[...names.map(t=>({t,v:()=>cfg.name===t+' TV'?'✓':''})),{t:'Other…',v:()=>'⌨',custom:true}]);
   if(!o)return null;
   if(o.custom){const n=await ask('Name this TV',cfg.name);if(!n?.trim())return 'again';cfg.name=n.trim()}else cfg.name=o.t+' TV';
   return o},
  ()=>choose('Choose a look','You can change this any time in Settings.',themeNames.map((t,i)=>({t,v:()=>cfg.theme===i?'✓':'',i}))).then(o=>{if(o){cfg.theme=o.i;applyTheme()}return o}),
  ()=>choose('Screen saver','Show slow pictures and the time when nothing is happening, to protect your TV.',
   [[0,'Off'],[5,'After 5 minutes'],[10,'After 10 minutes'],[30,'After 30 minutes']].map(([m,t])=>({t,v:()=>cfg.screensaver===m?'✓':'',m})),{icon:ICONS.moon})
   .then(o=>{if(o)cfg.screensaver=o.m;return o}),
  ()=>choose('Air OS is ready',`${cfg.name} is set up. Enjoy watching.`,[{t:'Get started',v:()=>'›'}],{logo:true}),
 ].filter(Boolean);
 for(let i=0;i<steps.length;){
  const r=await steps[i]();
  if(r==='again')continue;
  if(r===null){if(i>0)i--;continue}
  i++;
 }
 cfg.setupDone=true;save();document.body.classList.remove('setup');buildHome();pos={r:0,c:0};focus();
}

// ---- Boot: as fast as possible ----
(async()=>{
 const resume=new URLSearchParams(location.search).has('resume');  // coming back from YouTube/Netflix
 if(resume){history.replaceState(null,'','/');$('#boot').style.display='none'}
 try{sys=await api('info')}catch{sys=null}
 await loadCfg();applyTheme();showBattery(sys?.battery);setInterval(pollBattery,60000);
 if(sys?.features?.accounts)api('account').then(r=>acct=r.account).catch(()=>{});
 buildHome();pos={r:0,c:0};focus();
 booting=false;
 $('#boot').style.opacity=0;setTimeout(()=>$('#boot').style.display='none',350);
 if(!cfg.setupDone)return setup();
 tick();
 if(!resume&&cfg.start!=='home')run({youtube:()=>launch('youtube'),livetv:liveTV}[cfg.start]);
})();
