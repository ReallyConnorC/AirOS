<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Hello</title>
<style>
html,body{margin:0;height:100%;background:radial-gradient(circle at 30% 20%,#3a2a8f,#0b0c10 70%);color:#fff;font-family:system-ui,sans-serif;cursor:none}
main{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5vh}
#time{font-size:18vh;font-weight:200;letter-spacing:-.5vh}
.buttons{display:flex;gap:3vw}
button{font:600 3vh system-ui;padding:2.2vh 4vw;border:0;border-radius:2vh;background:#ffffff1f;color:#fff;transition:transform .15s}
button.focus{background:#fff;color:#000;transform:scale(1.1)}
p{color:#ffffff99;font-size:2.4vh}
</style>
</head>
<body>
<main>
 <div id="time"></div>
 <div class="buttons"><button>Red</button><button>Green</button><button>Blue</button></div>
 <p>← → to move · OK to choose · Home to go back to Air OS</p>
</main>
<script>
// Air OS remotes send arrow keys, Enter (OK) and Escape (Back) like a keyboard.
const tick=()=>document.getElementById('time').textContent=new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
tick();setInterval(tick,1000);
const buttons=[...document.querySelectorAll('button')],colours=['#8f2a2a','#1f6b3a','#1f3f8f'];let i=0;
const focus=()=>buttons.forEach((b,n)=>b.classList.toggle('focus',n===i));focus();
addEventListener('keydown',e=>{
 if(e.key==='ArrowRight')i=Math.min(i+1,buttons.length-1);
 else if(e.key==='ArrowLeft')i=Math.max(i-1,0);
 else if(e.key==='Enter')document.body.style.background=`radial-gradient(circle at 30% 20%,${colours[i]},#0b0c10 70%)`;
 else return;
 e.preventDefault();focus();
});
</script>
</body>
</html>
